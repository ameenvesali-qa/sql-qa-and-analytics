
name: SQL Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_practice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Load schema and seed data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d qa_practice -f schema.sql
          psql -h localhost -U postgres -d qa_practice -f seed.sql
      - name: Run QA checks
        env:
          PGPASSWORD: postgres
        run: |
          for f in qa-checks/*.sql; do
            echo "Running $f"
            psql -h localhost -U postgres -d qa_practice -f "$f"
          done

